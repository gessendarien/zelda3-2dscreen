# Example config for the 3DS port. Optional: copy to sd:/3ds/zelda3/zelda3.ini
# to override the defaults. Saves are stored in sd:/3ds/zelda3/saves/.

[General]
Autosave = 1
DisplayPerfInTitle = 0

[Graphics]
# Widescreen3DS: auto (default) = 400x240 widescreen on New 3DS only,
# on = always widescreen, off = always 256x240 (fastest).
Widescreen3DS = auto
# PerfOverlay3DS = 1 shows per-frame timings on the bottom screen
# (logic / ppu / blit / second screen / audio in tenths of ms, then fps).
PerfOverlay3DS = 0
NewRenderer = 1
# EnhancedMode7 is ignored on 3DS: 4x mode-7 rendering is far too slow here.
EnhancedMode7 = 1
NoSpriteLimits = 1

[Sound]
EnableAudio = 1
# 32000 is the cheapest for the CPU. MSU-1 packs need a specific rate:
# .pcm packs -> AudioFreq = 44100; .opuz packs -> AudioFreq = 48000.
AudioFreq = 32000
AudioChannels = 2
AudioSamples = 512
# MSU-1 soundtrack: 0 = off, 1 = .pcm pack, opuz = .opuz pack,
# deluxe / deluxe-opuz = MSU Deluxe packs. Put the track files in
# sd:/3ds/zelda3/msu/ (e.g. msu/1.pcm, msu/2.pcm ...) and set MSUPath.
EnableMSU = 1
MSUPath = msu/
MSUVolume = 100
ResumeMSU = 1

[Features]
ItemSwitchLR = 1
TurnWhileDashing = 0
MirrorToDarkworld = 0
CollectItemsWithSword = 0
BreakPotsWithSword = 0
DisableLowHealthBeep = 0
SkipIntroOnKeypress = 0
ShowMaxItemsInYellow = 0
MoreActiveBombs = 0
CarryMoreRupees = 0
MiscBugFixes = 1
GameChangingBugFixes = 0
CancelBirdTravel = 0

[GamepadMap]
# 3DS buttons map 1:1 onto the SNES layout.
# SNES:   B  Y  Select  Start  Up  Down  Left  Right  A   X   L   R
Controls = DpadUp, DpadDown, DpadLeft, DpadRight, Guide, Start, A, B, X, Y, L1, R1
